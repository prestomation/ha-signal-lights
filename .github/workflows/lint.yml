name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Compile check
        run: |
          find custom_components -name "*.py" -exec python -m py_compile {} +

      # Only the async rules run here. They find blocking calls (file reads,
      # time.sleep, requests) inside "async def". Other ruff rules are not
      # enforced yet.
      - name: Ruff async rules
        run: ruff check --select ASYNC .

      - name: Run unit tests
        run: python -m pytest tests/test_engine.py -v

      # Runs the code in an event loop with blockbuster. Blocking calls
      # fail the test. The log gate script tests are in the same folder.
      - name: Run unit tests that load the integration
        run: python -m pytest tests/unit -v

      - name: Run hassfest
        uses: "home-assistant/actions/hassfest@master"
