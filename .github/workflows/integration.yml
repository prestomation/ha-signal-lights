name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start Home Assistant
        working-directory: tests/integration
        run: docker compose up -d

      - name: Wait for Home Assistant to start
        run: bash scripts/wait-for-ha.sh

      - name: Run integration tests
        working-directory: tests/integration
        run: python -m pytest . -v --tb=short --timeout=300

      - name: Save Home Assistant log
        if: always()
        working-directory: tests/integration
        run: docker compose logs --no-color homeassistant > "$GITHUB_WORKSPACE/ha.log"

      - name: Upload Home Assistant log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-log
          path: ha.log
          if-no-files-found: warn

      # Last step. The log must have no warnings or errors from our code, no
      # "Detected blocking call" for our domain, and no known bad patterns.
      # Add exceptions to scripts/ha_log_allowlist.txt (with a reason).
      - name: Check Home Assistant log
        if: always()
        run: python scripts/check_ha_log.py --domain signal_lights ha.log

      # Last, so the stack runs until the log is saved and checked.
      - name: Cleanup
        if: always()
        working-directory: tests/integration
        run: docker compose down -v
